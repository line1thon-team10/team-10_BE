name: Validate PR contracts
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: line1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shards:
    name: contract shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: team10_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d team10_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require trusted private AI access
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          AI_DEPLOY_KEY: ${{ secrets.AI_SUBMODULE_SSH_KEY }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" || -z "$AI_DEPLOY_KEY" ]]; then
            echo '::error::This check requires a trusted same-repository branch with read access to the pinned private AI repository. Tests were not run.'
            exit 1
          fi
      # Default pull_request checkout tests the candidate merge with its base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read pinned AI revision
        id: revisions
        run: |
          echo "be=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ai=$(git rev-parse HEAD:vendor/team-10_AI)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: line1thon-team10/team-10_AI
          ref: ${{ steps.revisions.outputs.ai }}
          path: vendor/team-10_AI
          ssh-key: ${{ secrets.AI_SUBMODULE_SSH_KEY }}
          persist-credentials: false
      - name: Verify exact AI revision
        env:
          EXPECTED_AI: ${{ steps.revisions.outputs.ai }}
        run: test "$(git -C vendor/team-10_AI rev-parse HEAD)" = "$EXPECTED_AI"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate SQLite and PostgreSQL behavior
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/team10_test
        run: |
          python -m pip install -r requirements.txt -r requirements-ai.txt pytest==9.2.0 httpx==0.28.1
          python -m pip check
          python -m pytest -q tests --tb=short -x -p scripts.pytest_shard \
            --contract-shard-count=4 --contract-shard-index=${{ matrix.shard }}
      - name: Record tested revisions
        if: always()
        env:
          TESTED_BE: ${{ steps.revisions.outputs.be }}
          TESTED_AI: ${{ steps.revisions.outputs.ai }}
        run: |
          printf 'BE candidate merge: `%s`\n\nAI gitlink: `%s`\n' "$TESTED_BE" "$TESTED_AI" >> "$GITHUB_STEP_SUMMARY"

  # Preserve the existing branch-protection check name. A skipped, cancelled or
  # failed matrix must never turn this aggregate into a successful check.
  test:
    name: test
    if: ${{ always() }}
    needs: [shards]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every contract shard to succeed
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
        run: |
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Contract shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi
